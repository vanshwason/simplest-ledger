name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test parser, statement and CSV
        run: swift test --package-path LedgerCore
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        # Sideloadly signs it with your free Apple ID on install.
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -qry Ledger.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-ipa
          path: Ledger.ipa
      - name: Run in iPhone Simulator, type entries, screenshot
        # Windows can't run the simulator, so this is the "test it here" step. AI is off in CI, so it shows the rule parser.
        run: |
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild build -quiet
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]+ Pro \(" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE" && xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/Ledger.app
          xcrun simctl launch "$DEVICE" app.simple.ledger && sleep 8
          mkdir -p shots && xcrun simctl io "$DEVICE" screenshot shots/1-empty.png
          for t in "1500 spent on snacks via upi" "5000 rupees lent through credit card to Rahul" \
                   "salary 50000 credited" "paid 300" "got 2000 back from Rahul"; do
            xcrun simctl openurl "$DEVICE" "ledger://add?text=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$t")"
            sleep 3
          done
          xcrun simctl io "$DEVICE" screenshot shots/2-entries.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots
