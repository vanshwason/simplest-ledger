name: Build IPA
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the IPA to releases

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test parser, statement and CSV
        run: swift test --package-path LedgerCore
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned app
        run: |
          # A v1.2.3 tag makes the app version 1.2.3, so SideStore sees the update.
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS="MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          fi
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO $VERSION_ARGS build
      - name: Package IPA
        # Sideloadly signs it with your free Apple ID on install.
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -qry SimplestLedger.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SimplestLedger-ipa
          path: SimplestLedger.ipa
      - name: Attach IPA to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # sidestore.json is the SideStore source. Its link always points at the latest release:
        # https://github.com/<owner>/<repo>/releases/latest/download/sidestore.json
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"]
          raw = f"https://raw.githubusercontent.com/{repo}/main/docs"
          source = {
              "name": "Simplest Ledger", "identifier": "app.simple.ledger.source",
              "sourceURL": f"https://github.com/{repo}/releases/latest/download/sidestore.json",
              "iconURL": f"{raw}/icon.png", "website": f"https://github.com/{repo}",
              "apps": [{
                  "name": "Simplest Ledger", "bundleIdentifier": "app.simple.ledger",
                  "developerName": repo.split("/")[0], "subtitle": "A private expense tracker. Type it like a message.",
                  "localizedDescription": "Type what you spent and it's sorted for you. Bank SMS, splits, trips and monthly statements. No account, everything stays on your phone.",
                  "iconURL": f"{raw}/icon.png", "tintColor": "#00A884",
                  "screenshots": [f"{raw}/screenshots/{n}.png" for n in ("list", "typing", "sms-entry", "statement")],
                  "versions": [{
                      "version": tag.lstrip("v"), "buildVersion": os.environ["GITHUB_RUN_NUMBER"],
                      "date": datetime.date.today().isoformat(), "minOSVersion": "26.0",
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/SimplestLedger.ipa",
                      "size": os.path.getsize("SimplestLedger.ipa"),
                      "localizedDescription": f"See https://github.com/{repo}/releases/tag/{tag}",
                  }],
              }],
              "news": [],
          }
          json.dump(source, open("sidestore.json", "w"), indent=2)
          EOF
          gh release upload "$GITHUB_REF_NAME" SimplestLedger.ipa sidestore.json --clobber
      - name: Run in iPhone Simulator, type entries, screenshot
        # Windows can't run the simulator, so this is the "test it here" step. Apple Intelligence is not available here, so it uses the keyword parser.
        run: |
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild build -quiet
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]+ Pro \(" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE" && xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/Ledger.app
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3
          mkdir -p shots
          xcrun simctl launch "$DEVICE" app.simple.ledger && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/0-empty.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          LINES=$(printf '1500 spent on snacks via upi\n5000 rupees lent through credit card to Rahul\nsalary 50000 credited\npaid 300\ngot 2000 back from Rahul\nyesterday 1.5k uber\n1200 spent on outing by credit card')
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -add "$LINES" && sleep 10
          xcrun simctl io "$DEVICE" screenshot shots/1-entries.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -statement && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/2-statement.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -add "split the outing with Rahul, Amit and Neha" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/4-split.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -prefill "dinner 850 with friends via UPI" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/10-typing.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -sms "Rs.640.00 debited from A/c XX4821 on 20-11-26 to VPA blinkit@ybl. UPI Ref 631233445566. -HDFC Bank" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/11-sms-entry.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -auto-split -add "split the outing with Rahul, Amit and Neha" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/12-after-split.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -add "all entries were test entries please delete" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/5-delete.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -add "$(printf 'going on goa trip\nhotel 5000\npaid 300 for something')" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/6-trip.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -edit-first && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/7-edit.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -add "delete the xyz entry" && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/8-suggest.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard -sms-setup && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/9-sms.png
          xcrun simctl terminate "$DEVICE" app.simple.ledger
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl launch "$DEVICE" app.simple.ledger -no-keyboard && sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/3-dark.png
      - name: Small screen (iPhone SE)
        continue-on-error: true
        run: |
          SE=$(xcrun simctl list devices available | grep -m1 "iPhone SE" | grep -oE '[0-9A-F-]{36}' || true)
          [ -n "$SE" ] || SE=$(xcrun simctl create "SE" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation)
          xcrun simctl boot "$SE" && xcrun simctl bootstatus "$SE" -b
          xcrun simctl install "$SE" simbuild/Build/Products/Debug-iphonesimulator/Ledger.app
          xcrun simctl status_bar "$SE" override --time 9:41 --batteryLevel 100 --batteryState charged
          xcrun simctl launch "$SE" app.simple.ledger -no-keyboard -add "$(printf '1500 spent on snacks via upi\n5000 rupees lent through credit card to Rahul\nsalary 50000 credited\npaid 300')" && sleep 10
          xcrun simctl io "$SE" screenshot shots/se-1-entries.png
          xcrun simctl terminate "$SE" app.simple.ledger
          xcrun simctl launch "$SE" app.simple.ledger -sms-setup -no-keyboard && sleep 6
          xcrun simctl io "$SE" screenshot shots/se-2-sms.png
          xcrun simctl terminate "$SE" app.simple.ledger
          xcrun simctl launch "$SE" app.simple.ledger -no-keyboard -edit-first && sleep 6
          xcrun simctl io "$SE" screenshot shots/se-3-edit.png
          xcrun simctl terminate "$SE" app.simple.ledger
          xcrun simctl launch "$SE" app.simple.ledger -prefill "dinner 850 with friends via UPI" && sleep 6
          xcrun simctl io "$SE" screenshot shots/se-4-typing.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots
